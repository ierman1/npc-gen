<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Small web application that generates the description of a D&D NPC.">
    <title>NPC Generator</title>

    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./main.js"></script>
</head>
<body>
    <main class="app-shell">
        <header class="page-header">
            <h1>NPC Generator</h1>
            <p class="intro">Pick a gender, then choose a species.</p>
        </header>

        <section class="generator-panel" aria-label="NPC generator">
            <fieldset class="gender-toggle">
                <legend class="visually-hidden">NPC gender</legend>
                <label class="gender-option">
                    <input type="radio" name="gender" value="male" checked>
                    <span>Male</span>
                </label>
                <label class="gender-option">
                    <input type="radio" name="gender" value="female">
                    <span>Female</span>
                </label>
            </fieldset>

            <div id="species-buttons" class="species-buttons"></div>

            <div class="actions">
                <button class="button button-primary" id="generate-random" type="button">
                    Random species
                </button>
                <button class="button button-secondary" id="generate-all" type="button">
                    One of each species
                </button>
            </div>
            <p id="status-message" class="status-message" role="alert" hidden></p>
        </section>

        <section class="results-section" aria-labelledby="results-heading" hidden>
            <h2 id="results-heading" class="visually-hidden">Generated NPCs</h2>
            <div id="results" class="results" aria-live="polite"></div>
        </section>
    </main>
</body>
</html>
